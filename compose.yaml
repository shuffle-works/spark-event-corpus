services:
  spark-master:
    image: "apache/spark:${SPARK_VERSION}"
    # start-master.sh backgrounds the JVM via spark-daemon.sh and returns
    # immediately, which exits the container; invoke spark-class directly so
    # the Master JVM is PID 1 and stays in the foreground.
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "8080:8080"
    volumes:
      - ${EVENT_LOG_DIR}:/tmp/spark-events

  spark-worker-1:
    image: "apache/spark:${SPARK_VERSION}"
    # See spark-master: start-worker.sh backgrounds via spark-daemon.sh too.
    # --cores 2 is explicit on BOTH workers on purpose: left to auto-detect,
    # the Worker JVM derives its core count from the container's cgroup CPU
    # quota, so the slow-host worker would advertise fewer *task slots*
    # instead of running its tasks more slowly (see spark-worker-2).
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2"]
    depends_on: [spark-master]
    volumes:
      - ${EVENT_LOG_DIR}:/tmp/spark-events
      - ${WORKLOAD_OUTPUT_DIR}:/tmp/spark-workload-output
    deploy:
      resources:
        limits:
          cpus: "2"

  spark-worker-2:
    image: "apache/spark:${SPARK_VERSION}"
    # Advertises the same 2 task slots as spark-worker-1 regardless of its
    # real CPU quota: on a slow_host run WORKER_2_CPU_LIMIT drops to 0.5, so
    # this worker still accepts the same number of concurrent tasks but has
    # to run them under genuine CPU contention. That is a per-task duration
    # slowdown attributable to one host, which is what HOST/STRAG need.
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2"]
    depends_on: [spark-master]
    volumes:
      - ${EVENT_LOG_DIR}:/tmp/spark-events
      - ${WORKLOAD_OUTPUT_DIR}:/tmp/spark-workload-output
    deploy:
      resources:
        limits:
          cpus: "${WORKER_2_CPU_LIMIT}"

  spark-submit:
    image: "apache/spark:${SPARK_VERSION}"
    depends_on: [spark-master, spark-worker-1, spark-worker-2]
    volumes:
      - ./workload:/workload:ro
      - ${EVENT_LOG_DIR}:/tmp/spark-events
      - ${WORKLOAD_OUTPUT_DIR}:/tmp/spark-workload-output
    entrypoint: ["/opt/spark/bin/spark-submit"]
    # spark.sql.autoBroadcastJoinThreshold=-1: the workload's dimension tables
    # are far under the 10MB default, so every join planned as a
    # BroadcastHashJoin -- no Exchange, therefore no shuffle, no spill, and
    # spark.sql.shuffle.partitions had no observable effect at all. Forcing
    # SortMergeJoin is what makes the shuffle-partitions axis (and the SHFL/
    # SPILL/PART/TINY/SKEW detectors that depend on a real shuffle) mean
    # anything.
    # spark.sql.adaptive.coalescePartitions.enabled=false: with AQE on
    # (aqe=true rows), AQE otherwise merges the real shuffle's small
    # partitions back down to a handful once they're under its 64MB
    # advisory size, silently erasing the PART/TINY/SKEW signal on exactly
    # the pairwise rows that target them. Disabling only this AQE
    # sub-feature keeps the rest of AQE's behavior (join/skew re-planning)
    # intact while preserving the shuffle-partitions axis's real effect.
    # spark.dynamicAllocation.shuffleTracking.enabled=true: most runs use
    # dynamic_allocation=true, and now that a real shuffle exists,
    # reclaiming an idle executor without this would take its shuffle
    # files with it (FetchFailedException / stage retry) with no external
    # shuffle service configured.
    command: >
      --master spark://spark-master:7077
      --conf spark.eventLog.enabled=true
      --conf spark.eventLog.dir=/tmp/spark-events
      --conf spark.eventLog.rolling.enabled=false
      --conf spark.eventLog.compress=false
      --conf spark.sql.adaptive.enabled=${AQE}
      --conf spark.sql.adaptive.coalescePartitions.enabled=false
      --conf spark.sql.shuffle.partitions=${SHUFFLE_PARTITIONS}
      --conf spark.dynamicAllocation.enabled=${DYNAMIC_ALLOCATION}
      --conf spark.dynamicAllocation.shuffleTracking.enabled=true
      --conf spark.speculation=${SPECULATION}
      --conf spark.jars.ivy=/tmp/.ivy2
      --conf spark.sql.autoBroadcastJoinThreshold=-1
      ${PACKAGES_FLAG}
      ${TABLE_FORMAT_CONF_FLAGS}
      /workload/generate_events.py
      --row-count ${ROW_COUNT}
      --skew ${SKEW}
      --persist-mode ${PERSIST_MODE}
      --table-format ${TABLE_FORMAT}
      --failure ${FAILURE_MODE}
      --output-path /tmp/spark-workload-output/data
